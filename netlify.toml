[build]
  command = "npm run build"
  # Required by @netlify/plugin-nextjs. NOTE: a publish directory set in the
  # Netlify UI (Site configuration -> Build & deploy -> Build settings)
  # overrides this value. If the UI field is set to the repo root (or
  # anything other than ".next"), the plugin fails with "Your publish
  # directory cannot be the same as the base directory of your site" — clear
  # that UI field so this value takes effect.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # @netlify/plugin-nextjs (currently resolving to v5.16.6, "Next.js Runtime")
  # pulls in dependencies (chokidar@5, readdirp@5) that require Node >=20.19.0.
  # Netlify's "20" alias resolved to an older 20.x patch, which made every
  # production/preview build fail with a bare "exit code 2" — reproduced
  # locally by running the actual @netlify/build + @netlify/plugin-nextjs
  # pipeline (not just `next build`, which succeeded on its own either way)
  # under Node 20.18.1 vs 22. Bumping to 22 clears the incompatibility
  # outright rather than chasing the exact newer 20.x patch that's still
  # new enough.
  NODE_VERSION = "22"

  # Netlify's secret scanner fails the build whenever a configured secret's
  # value shows up anywhere under the build directory — including files that
  # never ship. After ZEFFY_API_KEY was added as a site env var, it started
  # appearing inside Turbopack's persistent build-cache shards
  # (.next/cache/turbopack/**/*.sst), which Next.js/Turbopack writes purely
  # to speed up incremental rebuilds. Verified locally (comparing this
  # directory against the plugin's actual packaged output — .netlify/static,
  # .netlify/functions-internal, .netlify/edge-functions) that .next/cache is
  # never copied into the static CDN assets, the serverless function bundle,
  # or the edge function bundle, so this file is never shipped or reachable
  # by anyone outside this build container. Omitting only this path (not the
  # key, and not scanning as a whole) keeps the scanner fully active for
  # every file that actually gets deployed.
  SECRETS_SCAN_OMIT_PATHS = "**/.next/cache/**"
