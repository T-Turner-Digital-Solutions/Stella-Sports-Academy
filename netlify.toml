[build]
  command = "npm run build"

# Do not set `publish` — the Next.js Runtime plugin below manages Netlify's
# publish directory and serverless/edge functions internally. Manually
# pointing `publish` at ".next" (a common manual misconfiguration) causes a
# generic Netlify "Page not found" screen, since .next/ has no static
# index.html at its root for a hybrid app with dynamic API routes.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
